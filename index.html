<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem('theme'); } catch {}
        const dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mike · Dev Notes - Linux、C/C++、网络工程与 AI 独立开发实践" />
    <meta name="keywords" content="Linux,C++,DPDK,AI辅助开发,独立开发,开源项目" />
    <meta name="author" content="Mike" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mike · Dev Notes" />
    <meta property="og:description" content="Linux、C/C++、网络工程与 AI 独立开发实践" />
    <meta property="og:image" content="https://avatars.githubusercontent.com/u/55485233?v=4" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:title" content="Mike · Dev Notes" />
    <meta property="twitter:description" content="Linux、C/C++、网络工程与 AI 独立开发实践" />
    <meta property="twitter:image" content="https://avatars.githubusercontent.com/u/55485233?v=4" />
    
    <title>Mike · Dev Notes - Linux / C++ &amp; AI</title>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
